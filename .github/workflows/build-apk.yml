name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - name: Use fixed signing key (so new builds can update the installed app)
        run: |
          mkdir -p ~/.android
          cp ci/debug.keystore ~/.android/debug.keystore
      - name: Disable Android lint tasks (lint tool crashes on some plugins)
        run: |
          mkdir -p ~/.gradle/init.d
          cat > ~/.gradle/init.d/disable-lint.gradle <<'EOF'
          allprojects {
            tasks.configureEach { t ->
              if (t.name.startsWith("lint")) { t.enabled = false }
            }
          }
          EOF
      - name: Generate Android project
        run: flutter create --platforms=android --org com.example --project-name marzban_admin .
      - name: Patch Android project
        run: python3 ci/patch_android.py
      - run: flutter pub get
      - run: flutter build apk --release --split-per-abi
      - uses: actions/upload-artifact@v4
        with:
          name: marzban-admin-apk
          path: build/app/outputs/flutter-apk/*.apk
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release delete latest --cleanup-tag -y || true
          gh release create latest build/app/outputs/flutter-apk/*.apk --target ${{ github.sha }} --title "Marzban Admin APK" --notes "Latest build. Use app-arm64-v8a-release.apk for most modern phones."
