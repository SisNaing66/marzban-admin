name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - name: Generate Android project
        run: flutter create --platforms=android --org com.example --project-name marzban_admin .
      - name: Allow internet + http panels
        run: |
          f=android/app/src/main/AndroidManifest.xml
          sed -i 's#<application#<uses-permission android:name="android.permission.INTERNET"/>\n    <application android:usesCleartextTraffic="true"#' $f
          grep -n "INTERNET\|Cleartext" $f
      - run: flutter pub get
      - run: flutter build apk --release --split-per-abi
      - uses: actions/upload-artifact@v4
        with:
          name: marzban-admin-apk
          path: build/app/outputs/flutter-apk/*.apk
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release delete latest --cleanup-tag -y || true
          gh release create latest build/app/outputs/flutter-apk/*.apk --target ${{ github.sha }} --title "Marzban Admin APK" --notes "Latest build. Use app-arm64-v8a-release.apk for most modern phones."
